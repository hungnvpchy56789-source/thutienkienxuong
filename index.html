<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo Trì Hệ Thống</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 700px;
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 20px;
            font-size: 32px;
        }

        p {
            color: #555;
            font-size: 20px;
            line-height: 1.6;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <h1>Trang Web Đang Bảo Trì</h1>
        <p>Mong Các Anh Chị Thông Cảm !</p>
    </div>
</body>
</html>
